# Render blueprint: one web service that serves the API, the WebSockets and the built React app.
# Render dashboard -> New -> Blueprint -> pick this repo, then fill the three "sync: false" values.
services:
  - type: web
    name: quizverse
    runtime: node
    plan: free
    # --include=dev: the client build needs Vite, which is a devDependency, and NODE_ENV=production skips those
    buildCommand: npm install --prefix client --include=dev && npm run build --prefix client && npm install --prefix server
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false # optional: enables "Continue with Google"
      - key: CLIENT_URL
        sync: false # the service's own public URL, e.g. https://quizverse.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-flash-latest
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
